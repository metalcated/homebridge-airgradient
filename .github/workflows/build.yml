name: Build, emulate and verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
        homebridge-version: ['1.6.0', '1.11.4', '2.4.0', '2.4.1-beta.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Lint and build
        run: npm run lint && npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate requested Homebridge runtime
        run: npm install --no-save --package-lock=false --ignore-scripts homebridge@${{ matrix.homebridge-version }}
      - name: Exercise emulated devices, Homebridge accessories and settings UI
        run: npm test
      - name: Check packaged contents
        run: npm pack --dry-run --ignore-scripts
