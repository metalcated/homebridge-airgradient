<header class="homey-header">
  <h1 class="homey-title" id="title" data-i18n="pair.title">Connect your thermostat</h1>
  <p class="homey-subtitle" id="subtitle" data-i18n="pair.subtitle">Enter the local address of your thermostat.</p>
</header>
<form class="homey-form" id="connect-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="host" data-i18n="pair.address">Thermostat IP address or hostname</label>
    <input class="homey-form-input" id="host" name="host" type="text" placeholder="192.168.1.50" required autocomplete="off" autocapitalize="none" spellcheck="false">
  </div>
  <p id="read-only-note" data-i18n="pair.readonly">New devices are read-only. Enable controls later in advanced settings.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <button class="homey-button-primary-full" id="connect" type="submit" data-i18n="pair.connect">Find thermostat zones</button>
</form>
<script type="application/javascript">
  (() => {
    const form = document.getElementById('connect-form');
    const host = document.getElementById('host');
    const button = document.getElementById('connect');
    const status = document.getElementById('status');
    let repair = false;
    let busy = false;
    let active = true;

    const initialize = async () => {
      const options = await Homey.getOptions() || {};
      repair = options.repair === true;
      if (repair) {
        document.getElementById('title').textContent = Homey.__('pair.repair_title');
        document.getElementById('subtitle').textContent = Homey.__('pair.repair_subtitle');
        document.getElementById('read-only-note').hidden = true;
        button.textContent = Homey.__('pair.repair_button');
        const info = await Homey.emit('repair_info');
        host.value = info.host || '';
      }
      Homey.setTitle(Homey.__(repair ? 'pair.repair_title' : 'pair.title'));
      host.focus();
    };

    window.addEventListener('pagehide', () => { active = false; });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (busy || !form.reportValidity()) return;
      busy = true;
      button.disabled = true;
      host.disabled = true;
      status.textContent = Homey.__('pair.working');
      try {
        await Homey.emit('connect', { host: host.value.trim() });
        if (!active) return;
        if (repair) {
          await Homey.alert(Homey.__('pair.repair_done'), 'info');
          Homey.done();
        } else {
          Homey.showView('list_devices');
        }
      } catch (error) {
        if (!active) return;
        status.textContent = Homey.__('pair.retry');
        await Homey.alert(error.message || String(error), 'error');
      } finally {
        busy = false;
        if (active) {
          button.disabled = false;
          host.disabled = false;
        }
      }
    });
    button.disabled = true;
    initialize().then(() => { button.disabled = false; }).catch(async (error) => {
      status.textContent = Homey.__('pair.retry');
      await Homey.alert(error.message || String(error), 'error');
    });
  })();
</script>
